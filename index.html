<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citali - Descarga la App</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <main class="main-content">
            <div class="app-icon">
                <img src="citaliApp.png" alt="Citali App Icon" class="app-image">
            </div>
            <h1 class="app-title">Citali</h1>
            <div class="app-description">
                <p>Descarga nuestra aplicación móvil.</p>
                <p>Disponible para iOS y Android.</p>
            </div>
            
            <div class="download-buttons">
                <a href="https://apps.apple.com/es/app/citali/id6751284021?l=es-ES" 
                   class="download-btn ios-btn" 
                   target="_blank" 
                   rel="noopener noreferrer">
                    <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" 
                         alt="Descargar en App Store" 
                         class="store-badge">
                </a>
                
                <a href="https://play.google.com/store/apps/details?id=com.mj.citali" 
                   class="download-btn android-btn" 
                   target="_blank" 
                   rel="noopener noreferrer">
                    <img src="https://play.google.com/intl/en_us/badges/static/images/badges/es_badge_web_generic.png" 
                         alt="Disponible en Google Play" 
                         class="store-badge">
                </a>
            </div>
            
            <p class="copyright">&copy; 2025 Citali. Todos los derechos reservados.</p>
        </main>
    </div>

    <script src="index.js"></script>
</body>
</html>
